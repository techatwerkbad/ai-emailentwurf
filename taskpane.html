<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Draft</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="config.js?v=1.3"></script>
  <link rel="stylesheet" href="taskpane.css?v=1.3">
</head>
<body>
  <header>
    <h1>AI Draft</h1>
    <p class="muted">Nothing is sent automatically.</p>
  </header>

  <section id="mailInfo" class="card">
    <div class="label">Email</div>
    <div id="mailSubject" class="strong">–</div>
    <div id="mailFrom" class="muted">–</div>
    <div id="mailBox" class="muted small"></div>
  </section>

  <section class="card">
    <label for="hint" class="label">Note for the AI (optional)</label>
    <textarea id="hint" rows="3" placeholder="e.g. delivery in week 48, order shipped today, keep it short …"></textarea>
    <button id="btnDraft" class="primary">Prepare draft</button>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </section>

  <section id="result" class="card hidden">
    <div id="meta" class="meta"></div>
    <div id="note" class="note hidden"></div>
    <label for="draft" class="label">Draft</label>
    <textarea id="draft" rows="14"></textarea>
    <div class="row">
      <button id="btnReply" class="primary">Open as reply</button>
      <button id="btnReplyAll">Reply all</button>
      <button id="btnCopy">Copy</button>
    </div>
    <div id="internal" class="internal hidden"></div>
  </section>

  <details class="card">
    <summary>Settings</summary>
    <label for="cfgUrl" class="label">Make Webhook URL</label>
    <input id="cfgUrl" type="url" placeholder="https://hook.eu1.make.com/…">
    <label for="cfgToken" class="label">Token (X-Token)</label>
    <input id="cfgToken" type="password" autocomplete="off">
    <button id="btnSave">Save</button>
    <div id="cfgStatus" class="status"></div>
  </details>

  <script src="taskpane.js?v=1.3"></script>
</body>
</html>
